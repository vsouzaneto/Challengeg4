[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "support-decision-copilot"
version = "0.1.0"
description = "Local proof for the Support Decision Copilot challenge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "streamlit>=1.64,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
