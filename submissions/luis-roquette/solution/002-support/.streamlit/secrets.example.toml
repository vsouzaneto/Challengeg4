# Copy these keys into Streamlit Cloud secrets. Never commit secrets.toml.
[auth]
redirect_uri = "https://support-decision-copilot-luis.streamlit.app/oauth2callback"
cookie_secret = "SET_IN_STREAMLIT_CLOUD"
client_id = "SET_IN_STREAMLIT_CLOUD"
client_secret = "SET_IN_STREAMLIT_CLOUD"
server_metadata_url = "https://YOUR-IDP/.well-known/openid-configuration"

[authorization]
allowed_issuers = ["https://YOUR-IDP"]
allowed_subjects = ["OIDC-SUBJECT-FOR-EACH-OPERATOR"]
