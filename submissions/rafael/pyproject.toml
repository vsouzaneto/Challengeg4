# Packaging for the analysis library (social_insights) and the web app (social_web).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-audit"
version = "1.0.0"
description = "Challenge 004 — análise de 52K posts, modelos e site com servidor"
requires-python = ">=3.11"

[project.scripts]
social-web = "social_web.server:main"

[tool.setuptools.packages.find]
where = ["solution/src"]

[tool.setuptools.package-data]
social_web = ["templates/*.html", "static/*/*", "static/*"]
