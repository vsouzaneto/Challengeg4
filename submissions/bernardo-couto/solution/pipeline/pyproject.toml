[project]
name = "lead-scorer-pipeline"
version = "0.1.0"
description = "PySpark batch pipeline (bronze -> silver -> gold) and Spark ML model for the Lead Scorer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pyspark==3.5.*",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2,<3",
    "typer>=0.12",
    "lead-scorer-contracts",
    "setuptools>=75",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "chispa>=0.10",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "matplotlib>=3.11.2",
]

[tool.uv.sources]
lead-scorer-contracts = { path = "../shared/lead_scorer_contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
extend-exclude = ["analysis"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]
# N812: `from pyspark.sql import functions as F` is the universal PySpark idiom.
ignore = ["N812"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true
