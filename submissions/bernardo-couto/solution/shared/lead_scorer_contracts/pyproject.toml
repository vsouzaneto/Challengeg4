[project]
name = "lead-scorer-contracts"
version = "1.0.0"
description = "Single-source Pydantic contract (ScoredDeal) shared by the Spark pipeline and the FastAPI service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = ["pydantic>=2,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_scorer_contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
