[project]
name = "lead-scorer-api"
version = "1.0.0"
description = "FastAPI service that serves the committed gold/scores parquet through a documented REST API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2,<3",
    "pydantic-settings>=2.4",
    "lead-scorer-contracts",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.2"]

[tool.uv.sources]
lead-scorer-contracts = { path = "../shared/lead_scorer_contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["api", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true
