Proposed journey from pre-sales assistance to customer follow-up. AI prepares and assists; deterministic rules control routing, while operators authorize consequential decisions. = Jornada proposta desde o suporte de pré-vendas até o acompanhamento do cliente. A IA prepara e auxilia; regras determinísticas controlam o encaminhamento, enquanto operadores autorizam decisões de maior consequência.
Keep financial, contractual and sensitive decisions under qualified human control. Use automation to prepare cases, enforce follow-up and improve operator efficiency. = Manter decisões financeiras, contratuais e sensíveis sob controle humano qualificado. Utilizar automação para preparar casos, assegurar o acompanhamento e melhorar a eficiência dos operadores.
1,752 Refund and 1,695 Cancellation. This confirms request volume, not that every case originated from purchase confusion. Preventable share requires measurement. = 1.752 chamados de reembolso e 1.695 de cancelamento. Isso confirma o volume de solicitações, não que todos os casos tenham surgido de dúvidas na compra. A parcela evitável ainda precisa ser medida.
Proactive e-commerce chat using LLM + RAG, verified product specifications, compatibility checks and approved purchase policies; human escalation for exceptions. = Chat proativo no comércio eletrônico com LLM + RAG, especificações de produto verificadas, checagens de compatibilidade e políticas de compra aprovadas; encaminhamento humano para exceções.
Workflow tracks deadlines; humans initiate authorized alternative contact during 24–48h; closure after 72h follows documented policy and exception handling. = O fluxo acompanha os prazos; pessoas iniciam contato alternativo autorizado entre 24 e 48 horas; o encerramento após 72 horas segue política documentada e tratamento de exceções.
Automate repetitive operations with deterministic workflows, local NLP and selective LLM/RAG. The model assists; operational rules authorize actions. = Automatizar operações repetitivas com fluxos determinísticos, NLP local e uso seletivo de LLM/RAG. O modelo auxilia; as regras operacionais autorizam as ações.
Evaluated classifier: LinearSVC, 86.43% Test Macro-F1 on Dataset 2. Human review remains necessary for uncertain, sensitive and out-of-domain cases. = Classificador avaliado: LinearSVC, Macro-F1 de 86,43% no teste do Dataset 2. A revisão humana continua necessária em casos incertos, sensíveis e fora do domínio.
Stated annual volume; distinct from the 8,469-ticket Dataset 1 sample. Historical elapsed resolution time is not equivalent to human labor hours. = Volume anual declarado, distinto da amostra de 8.469 chamados do Dataset 1. Tempo decorrido de resolução não equivale a horas de trabalho humano.
Automate verified operational gaps with measurable goals, explicit execution design and documented evidence. = Automatizar lacunas operacionais verificadas, com metas mensuráveis, desenho explícito da execução e evidências documentadas.
Open without a recorded first response = Abertos sem primeira resposta registrada
Candidates, not confirmed duplicate incidents = Candidatos, não incidentes duplicados confirmados
The observed commercial ticket volume establishes the opportunity. How many cases are preventable remains to be measured. = O volume observado de chamados comerciais demonstra a oportunidade. Ainda é necessário medir quantos casos podem ser evitados.
All Open records in the snapshot lack a recorded First Response Time. This does not prove no contact happened in another channel. = Todos os registros abertos da amostra não têm um tempo de primeira resposta registrado. Isso não comprova ausência de contato em outro canal.
LinearSVC selected after supervised benchmark. Test Macro-F1: 86.43% on held-out Dataset 2 data. Performance on Dataset 1 remains unvalidated. = LinearSVC selecionado após avaliação supervisionada. Macro-F1 de teste: 86,43% nos dados reservados do Dataset 2. O desempenho no Dataset 1 ainda não foi validado.
The workload supports triage redesign. Historical labels alone cannot establish actual urgency or SLA violations. = O volume de trabalho sustenta o redesenho da triagem. Os rótulos históricos, isoladamente, não comprovam urgência real nem violações de SLA.
