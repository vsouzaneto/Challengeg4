These figures do not establish realized financial ROI. = Esses números não comprovam ROI financeiro realizado.
This analysis uses Closed tickets with observable CSAT. Ratings 1-3 are treated as unmet expectation / dissatisfaction; ratings 4-5 indicate satisfaction. Group comparisons are descriptive associations and do not establish causality. = Esta análise utiliza chamados encerrados com CSAT observável. Notas de 1 a 3 indicam expectativa não atendida/insatisfação; notas de 4 a 5 indicam satisfação. Comparações entre grupos são associações descritivas e não estabelecem causalidade.
