The workflow state is a snapshot. Open and Pending identify tickets that are not closed, but they do not reveal ticket age. Closed without Resolution is handled separately as an operational completeness issue without assuming that the Resolution field represents elapsed time. = O estado do fluxo é um retrato dos dados. Open e Pending identificam chamados não encerrados, mas não revelam sua idade. Closed sem Resolution é tratado separadamente como questão de completude operacional, sem assumir que Resolution represente tempo decorrido.
Theoretical capacity savings are not realized cash savings. = Economia teórica de capacidade não equivale a economia financeira realizada.
