[project]
name = "social-ops-decision-system"
version = "0.1.0"
description = "Challenge 004: análise, arquitetura de processo e Decision Gate para social media"
requires-python = ">=3.11"
dependencies = [
    "kagglehub>=0.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "streamlit>=1.38",
    "plotly>=5.24",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
